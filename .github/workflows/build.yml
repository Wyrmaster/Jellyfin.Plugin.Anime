name: Build Anime Plugin

# Release: push a tag like v1.0.7. The workflow builds, creates the GitHub release
# and commits the updated manifest.json back to master.
on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version and ABI
        run: |
          if [ "$IS_RELEASE" = "true" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-ci"; fi
          TARGET_ABI=$(grep -oPm1 '(?<=<PackageReference Include="Jellyfin.Controller" Version=")[^"]*' Jellyfin.Plugin.Anime.csproj)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TARGET_ABI=${TARGET_ABI}" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.Anime.csproj --configuration Release -p:Version=${{ env.VERSION }} -o output

      - name: Zip plugin
        run: |
          cd output
          zip ../Jellyfin.Plugin.Anime.v${{ env.VERSION }}.zip \
            GraphQL.Client.Abstractions.dll \
            GraphQL.Client.Abstractions.Websocket.dll \
            GraphQL.Client.dll \
            GraphQL.Client.Serializer.SystemTextJson.dll \
            GraphQL.Primitives.dll \
            Jellyfin.Plugin.Anime.dll \
            System.Linq.Async.dll \
            System.Reactive.dll

      - name: Upload build artifact
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: Jellyfin.Plugin.Anime.v${{ env.VERSION }}.zip

      - name: Update manifest.json on master
        if: env.IS_RELEASE == 'true'
        run: |
          CHECKSUM=$(md5sum Jellyfin.Plugin.Anime.v${{ env.VERSION }}.zip | awk '{ print $1 }')
          git fetch origin master
          git checkout -B master origin/master
          jq --arg version "${{ env.VERSION }}" \
             --arg checksum "$CHECKSUM" \
             --arg sourceUrl "https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/Jellyfin.Plugin.Anime.v${{ env.VERSION }}.zip" \
             --arg targetAbi "${{ env.TARGET_ABI }}" \
             --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
             '.[0].versions = [{
                checksum: $checksum,
                sourceUrl: $sourceUrl,
                targetAbi: $targetAbi,
                timestamp: $timestamp,
                version: $version
              }] + (.[0].versions | map(select(.version != $version)))' manifest.json > manifest-updated.json
          mv manifest-updated.json manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest.json for v${{ env.VERSION }} [skip ci]"
          git push origin master

      - name: Create GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Jellyfin.Plugin.Anime.v${{ env.VERSION }}.zip
            manifest.json
